<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Strappacamicia - Login</title>
    </head>

    <body>
        <h1 style="text-align: center;">Accedi a Strappacamicia</h1>

        <form id="formLogin">
            <label for="nickname">Nickname:</label>
            <input type="text" id="nickname" name="nickname">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <button type="submit">Accedi</button>
        </form>
        <script>
                const formLogin = document.getElementById("formLogin");

                formLogin.addEventListener("submit", function(evento){ //Diciamo a Javascript di eseguire una funzione quando il form viene inviato
                    evento.preventDefault(); //questa riga blocca il comportamento normale del form, senza preventDefault() prendendo Accedi il browser ricaricherebbe normalmente la pagina

                const nickname = document.getElementById("nickname").value; //in questa maniera con getElementById("nickname") recupero il campo tramite il DOM e con .value prendo il testo che l'utente ha digitato
            });
        </script>
    </body>
</html>
