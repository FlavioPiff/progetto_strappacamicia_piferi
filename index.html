<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Strappacamicia - Login</title>
    </head>

    <body>
        <h1 style="text-align: center;">Accedi a Strappacamicia</h1>

        <form id="formLogin">
            <label for="nickname">Nickname:</label>
            <input type="text" id="nickname" name="nickname">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <button type="submit">Accedi</button>
        </form>
        <script>
                const formLogin = document.getElementById("formLogin");

                formLogin.addEventListener("submit", function(evento){ //Diciamo a Javascript di eseguire una funzione quando il form viene inviato
                    evento.preventDefault(); //questa riga blocca il comportamento normale del form, senza preventDefault() prendendo Accedi il browser ricaricherebbe normalmente la pagina

                const nickname = document.getElementById("nickname").value; //in questa maniera con getElementById("nickname") recupero il campo tramite il DOM e con .value prendo il testo del nickname che l'utente ha digitato
                const password = document.getElementById("password").value; //in questa maniera con getElementById("password") recupero il campo tramite il DOM e con .value prendo il testo della password che l'utente ha digitato

                const datiLogin = {nickname: nickname, password: password}; //creo un oggetto Javascript datiLogin che userò per memorizzare i dati di nickname e password che poi invierò a PHP

                fetch("php/login.php", {
                    method: "POST", //invio una richiesta POST con dati JSON al file PHP che gestisce il login
                    headers: {
                        "Content-Type": "application/json" // In questa maniera dico a login.php che i dati che gli "invierò" sono in formato JSON
                    },
                    body: JSON.stringify(datiLogin) //invio nickname e password al file PHP in formato JSON, datiLogin è un oggetto Javascript e JSON.stringify() lo trasforma in JSON
                })
                .then(function(risposta){
                    return risposta.json(); //converto la risposta ricevuta da PHP in dati Javascript
                })
                .then(function(risultato){
                    if (risultato.successo === true){ //controllo se il login è riuscito
                        console.log("Login riuscito"); //mostro nella console che il login è andato a buon fine (nickname e password sono corretti)
                    }
                    else {
                        console.log("Login non riuscito"); //mostro nella console il login non è andato a buon fine (nickname o password non sono corretti)
                    }
                });
            });
        </script>
    </body>
</html>
